services:
  exporter:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        BRANCH: ${BRANCH:-dev}
        REVISION: ${REVISION:-dev}
        BUILD_USER: ${BUILD_USER:-compose}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    command:
      - --web.listen-address=:9820
      - --${FEATURE_NAME:-puppetfile}.config-file=${FEATURE_CONFIG_CONTAINER_PATH:-/etc/prometheus/prometheus-puppetfile-exporter.yml}
      - --${FEATURE_NAME:-puppetfile}.refresh-interval=1h
    configs:
      - source: feature_config
        target: ${FEATURE_CONFIG_CONTAINER_PATH:-/etc/prometheus/prometheus-puppetfile-exporter.yml}
    ports:
      - "127.0.0.1:${COMPOSE_EXPORTER_HOST_PORT:-9820}:9820"

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.14.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      exporter:
        condition: service_started
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - ./examples/prometheus/:/etc/prometheus/rules/:ro

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    configs:
      - source: grafana_prometheus_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
    volumes:
      - ./examples/grafana/:/var/lib/grafana/dashboards/:ro
      - ./examples/grafana/alerting/:/etc/grafana/provisioning/alerting/:ro
    depends_on:
      prometheus:
        condition: service_started

configs:
  feature_config:
    file: ./${FEATURE_CONFIG_PATH:-examples/prometheus-puppetfile-exporter.yml}
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      rule_files:
        - /etc/prometheus/rules/*.yml

      scrape_configs:
        - job_name: ${FEATURE_NAME:-puppetfile}-exporter
          static_configs:
            - targets:
                - exporter:9820
  grafana_prometheus_datasource:
    content: |
      apiVersion: 1

      datasources:
        - name: Prometheus
          uid: DS_PROMETHEUS
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
  grafana_dashboards_provider:
    content: |
      apiVersion: 1

      providers:
        - name: ${PROJECT_DESC:-Exporter}
          orgId: 1
          folder: Exporters
          type: file
          disableDeletion: true
          editable: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards
